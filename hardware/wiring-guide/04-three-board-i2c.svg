<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1270" viewBox="0 0 1800 1270"><rect x="0" y="0" width="1800" height="1270" rx="0" fill="#f3f7fa" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1800" height="123" rx="0" fill="#142c42" stroke="none" stroke-width="1"/><text x="40" y="49" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#9cd9d2">DUAL-REALITY MAZE / WIRING SHEET 04</text><text x="40" y="91" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" text-anchor="start" fill="white">Connect both R3 controllers to Main</text><text x="1760" y="86" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="end" fill="#ffd6a5">POWER OFF BEFORE WIRING</text><text x="40" y="153" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#142c42">One shared I2C bus: Main polls unique addresses. Both controllers can be used at the same time.</text><rect x="40" y="190" width="1720" height="700" rx="10" fill="white" stroke="#d8e2e9" stroke-width="1"/><text x="60" y="223" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#142c42">SYSTEM CONNECTIONS / all grounds common; each board powered through its own USB cable</text><rect x="80" y="280" width="360" height="250" rx="8" fill="#f8fafb" stroke="#a7bac7" stroke-width="2"/><text x="95" y="310" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">ARCHITECT / UNO R3</text><text x="95" y="334" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#536778">Address 0x11</text><text x="260" y="391" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#142c42">A4 / SDA</text><text x="260" y="436" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#142c42">A5 / SCL</text><text x="260" y="481" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#142c42">GND</text><rect x="700" y="280" width="360" height="250" rx="8" fill="#f8fafb" stroke="#a7bac7" stroke-width="2"/><text x="715" y="310" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">MAIN / UNO R4 WiFi</text><text x="715" y="334" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#536778">Bus controller / 100 kHz</text><text x="880" y="391" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#142c42">A4 / SDA</text><text x="880" y="436" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#142c42">A5 / SCL</text><text x="880" y="481" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#142c42">GND</text><rect x="1310" y="280" width="360" height="250" rx="8" fill="#f8fafb" stroke="#a7bac7" stroke-width="2"/><text x="1325" y="310" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">EXPLORER / UNO R3</text><text x="1325" y="334" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#536778">Address 0x10</text><text x="1490" y="391" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#142c42">A4 / SDA</text><text x="1490" y="436" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#142c42">A5 / SCL</text><text x="1490" y="481" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#142c42">GND</text><g class="wire" data-category="sda"><polyline points="440,385 700,385" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="440,385 700,385" fill="none" stroke="#008470" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="440" cy="385" r="4" fill="#008470"/><circle cx="700" cy="385" r="4" fill="#008470"/></g><g class="wire" data-category="sda"><polyline points="1060,385 1310,385" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1060,385 1310,385" fill="none" stroke="#008470" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1060" cy="385" r="4" fill="#008470"/><circle cx="1310" cy="385" r="4" fill="#008470"/></g><g class="wire" data-category="scl"><polyline points="440,430 700,430" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="440,430 700,430" fill="none" stroke="#2167b3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="440" cy="430" r="4" fill="#2167b3"/><circle cx="700" cy="430" r="4" fill="#2167b3"/></g><g class="wire" data-category="scl"><polyline points="1060,430 1310,430" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1060,430 1310,430" fill="none" stroke="#2167b3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1060" cy="430" r="4" fill="#2167b3"/><circle cx="1310" cy="430" r="4" fill="#2167b3"/></g><g class="wire" data-category="ground"><polyline points="440,475 700,475" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="440,475 700,475" fill="none" stroke="#374151" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="440" cy="475" r="4" fill="#374151"/><circle cx="700" cy="475" r="4" fill="#374151"/></g><g class="wire" data-category="ground"><polyline points="1060,475 1310,475" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1060,475 1310,475" fill="none" stroke="#374151" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1060" cy="475" r="4" fill="#374151"/><circle cx="1310" cy="475" r="4" fill="#374151"/></g><text x="570" y="353" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#536778">30 cm cable</text><text x="1185" y="353" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#536778">30 cm cable</text><rect x="690" y="650" width="380" height="180" rx="8" fill="#f8fafb" stroke="#a7bac7" stroke-width="2"/><text x="705" y="680" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">LCD backpack</text><text x="705" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#536778">Shares the same SDA / SCL bus</text><g class="wire" data-category="sda"><polyline points="750,530 750,650" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="750,530 750,650" fill="none" stroke="#008470" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="750" cy="530" r="4" fill="#008470"/><circle cx="750" cy="650" r="4" fill="#008470"/></g><text x="750" y="628" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#008470">SDA</text><circle cx="750" cy="530" r="5" fill="#008470"/><text x="750" y="548" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#142c42"></text><g class="wire" data-category="scl"><polyline points="830,530 830,650" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="830,530 830,650" fill="none" stroke="#2167b3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="830" cy="530" r="4" fill="#2167b3"/><circle cx="830" cy="650" r="4" fill="#2167b3"/></g><text x="830" y="628" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2167b3">SCL</text><circle cx="830" cy="530" r="5" fill="#2167b3"/><text x="830" y="548" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#142c42"></text><g class="wire" data-category="ground"><polyline points="910,530 910,650" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="910,530 910,650" fill="none" stroke="#374151" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="910" cy="530" r="4" fill="#374151"/><circle cx="910" cy="650" r="4" fill="#374151"/></g><text x="910" y="628" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#374151">GND</text><circle cx="910" cy="530" r="5" fill="#374151"/><text x="910" y="548" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#142c42"></text><text x="880" y="485" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42"></text><text x="750" y="520" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#142c42">SDA</text><text x="830" y="520" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#142c42">SCL</text><text x="910" y="520" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#142c42">GND</text><text x="990" y="520" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#142c42">5V</text><g class="wire" data-category="power"><polyline points="990,530 990,650" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="990,530 990,650" fill="none" stroke="#b92d35" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="990" cy="530" r="4" fill="#b92d35"/><circle cx="990" cy="650" r="4" fill="#b92d35"/></g><text x="990" y="628" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#b92d35">Main 5V</text><text x="90" y="590" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">Architect USB-B -&gt; powered USB</text><text x="90" y="621" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">hub or laptop. The servo has a</text><text x="90" y="652" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">separate regulated 5V supply</text><text x="90" y="683" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">with common ground.</text><text x="1310" y="590" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">Explorer USB-B -&gt; powered</text><text x="1310" y="621" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">USB hub or laptop.</text><text x="1310" y="740" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">Main USB-C provides power.</text><text x="1310" y="771" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">Main built-in Wi-Fi -&gt; laptop</text><text x="1310" y="802" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">game. No controller Wi-Fi</text><text x="1310" y="833" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">modules are required.</text><text x="90" y="798" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#b92d35">NO 5V jumper between boards.</text><text x="90" y="833" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#142c42">Only SDA + SCL + GND belong in each</text><text x="90" y="859" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#142c42">controller cable.</text><text x="40" y="936" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#142c42">ASSEMBLY ORDER</text><rect x="40" y="958" width="415" height="209" rx="10" fill="white" stroke="#d8e2e9" stroke-width="1"/><circle cx="68" cy="988" r="16" fill="#142c42" stroke="none" stroke-width="2"/><text x="68" y="994" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">1</text><text x="95" y="995" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">Ground first</text><text x="60" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">Unplug USB and the servo supply.</text><text x="60" y="1055" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">Architect GND -&gt; Main GND. Explorer</text><text x="60" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">GND -&gt; Main GND. Include the servo</text><text x="60" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">supply negative in this common</text><text x="60" y="1130" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">ground.</text><rect x="475" y="958" width="415" height="209" rx="10" fill="white" stroke="#d8e2e9" stroke-width="1"/><circle cx="503" cy="988" r="16" fill="#142c42" stroke="none" stroke-width="2"/><text x="503" y="994" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">2</text><text x="530" y="995" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">Add the two signals</text><text x="495" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">Architect A4 -&gt; Main A4 (SDA); A5 -&gt;</text><text x="495" y="1055" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">Main A5 (SCL). Explorer A4 -&gt; the</text><text x="495" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">SAME Main A4 (SDA); A5 -&gt; the SAME</text><text x="495" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">Main A5 (SCL). Use breadboard</text><text x="495" y="1130" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">junctions to fan out.</text><rect x="910" y="958" width="415" height="209" rx="10" fill="white" stroke="#d8e2e9" stroke-width="1"/><circle cx="938" cy="988" r="16" fill="#142c42" stroke="none" stroke-width="2"/><text x="938" y="994" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">3</text><text x="965" y="995" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">Check pull-ups</text><text x="930" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">If the LCD backpack lacks suitable</text><text x="930" y="1055" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">pull-ups, add one 4.7k from SDA to</text><text x="930" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">Main 5V and one 4.7k from SCL to</text><text x="930" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">Main 5V. Do not add a pair at every</text><text x="930" y="1130" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">board.</text><rect x="1345" y="958" width="415" height="209" rx="10" fill="white" stroke="#d8e2e9" stroke-width="1"/><circle cx="1373" cy="988" r="16" fill="#142c42" stroke="none" stroke-width="2"/><text x="1373" y="994" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">4</text><text x="1400" y="995" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">Power and connect</text><text x="1365" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">Power all boards together. Start</text><text x="1365" y="1055" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">Maze.bat -&gt; Connect Main Wi-Fi.</text><text x="1365" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">Confirm both controllers OK, then</text><text x="1365" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">blue Main status. Keep the joystick</text><text x="1365" y="1130" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">centered during reconnect.</text><text x="40" y="1202" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#536778">Line colors identify signals; use pin labels even if your jumper colors differ. Dots mark electrical junctions.</text><text x="40" y="1230" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#536778">Board illustration is simplified; it is not a drill template or a breadboard-hole map. See Sources in the browser guide.</text><text x="1760" y="1230" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#536778">04 / Dual-Reality Maze</text></svg>