<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1270" viewBox="0 0 1800 1270"><rect x="0" y="0" width="1800" height="1270" rx="0" fill="#f3f7fa" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1800" height="123" rx="0" fill="#142c42" stroke="none" stroke-width="1"/><text x="40" y="49" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#9cd9d2">DUAL-REALITY MAZE / WIRING SHEET 05</text><text x="40" y="91" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" text-anchor="start" fill="white">Optional Main lighting - four green LEDs</text><text x="1760" y="86" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="end" fill="#ffd6a5">POWER OFF BEFORE WIRING</text><text x="40" y="153" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#142c42">Use this sheet only if fitting the four decorative LEDs. They fade together from one transistor channel.</text><rect x="40" y="190" width="1720" height="700" rx="10" fill="white" stroke="#d8e2e9" stroke-width="1"/><text x="60" y="223" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#142c42">LOW-SIDE MOSFET DRIVER / LED current comes from the 5V rail, not directly from D10</text><text x="140" y="280" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#b92d35">Main 5V</text><g class="wire" data-category="power"><polyline points="260,273 1510,273" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="260,273 1510,273" fill="none" stroke="#b92d35" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="260" cy="273" r="4" fill="#b92d35"/><circle cx="1510" cy="273" r="4" fill="#b92d35"/></g><g class="wire" data-category="power"><polyline points="650,273 650,335" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="650,273 650,335" fill="none" stroke="#b92d35" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="650" cy="273" r="4" fill="#b92d35"/><circle cx="650" cy="335" r="4" fill="#b92d35"/></g><rect x="640" y="335" width="20" height="55" rx="1" fill="#fff7dd" stroke="#b92d35" stroke-width="2"/><text x="672" y="366" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#b92d35">330 ohm</text><polyline points="650,390 650,430" fill="none" stroke="#b92d35" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="650" cy="455" r="25" fill="#e6f5df" stroke="#268045" stroke-width="3"/><text x="650" y="461" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#268045">LED</text><text x="686" y="436" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#b92d35">+</text><text x="686" y="485" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#374151">-</text><g class="wire" data-category="ground"><polyline points="650,480 650,550" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="650,480 650,550" fill="none" stroke="#374151" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="650" cy="480" r="4" fill="#374151"/><circle cx="650" cy="550" r="4" fill="#374151"/></g><circle cx="650" cy="273" r="5" fill="#b92d35"/><circle cx="650" cy="550" r="5" fill="#374151"/><g class="wire" data-category="power"><polyline points="900,273 900,335" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="900,273 900,335" fill="none" stroke="#b92d35" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx=