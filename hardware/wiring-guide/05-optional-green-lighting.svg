t-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#b92d35">330 ohm</text><polyline points="1150,390 1150,430" fill="none" stroke="#b92d35" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1150" cy="455" r="25" fill="#e6f5df" stroke="#268045" stroke-width="3"/><text x="1150" y="461" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#268045">LED</text><text x="1186" y="436" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#b92d35">+</text><text x="1186" y="485" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#374151">-</text><g class="wire" data-category="ground"><polyline points="1150,480 1150,550" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1150,480 1150,550" fill="none" stroke="#374151" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1150" cy="480" r="4" fill="#374151"/><circle cx="1150" cy="550" r="4" fill="#374151"/></g><circle cx="1150" cy="273" r="5" fill="#b92d35"/><circle cx="1150" cy="550" r="5" fill="#374151"/><g class="wire" data-category="power"><polyline points="1400,273 1400,335" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1400,273 1400,335" fill="none" stroke="#b92d35" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1400" cy="273" r="4" fill="#b92d35"/><circle cx="1400" cy="335" r="4" fill="#b92d35"/></g><rect x="1390" y="335" width="20" height="55" rx="1" fill="#fff7dd" stroke="#b92d35" stroke-width="2"/><text x="1422" y="366" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#b92d35">330 ohm</text><polyline points="1400,390 1400,430" fill="none" stroke="#b92d35" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1400" cy="455" r="25" fill="#e6f5df" stroke="#268045" stroke-width="3"/><text x="1400" y="461" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#268045">LED</text><text x="1436" y="436" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#b92d35">+</text><text x="1436" y="485" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#374151">-</text><g class="wire" data-category="ground"><polyline points="1400,480 1400,550" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1400,480 1400,550" fill="none" stroke="#374151" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1400" cy="480" r="4" fill="#374151"/><circle cx="1400" cy="550" r="4" fill="#374151"/></g><circle cx="1400" cy="273" r="5" fill="#b92d35"/><circle cx="1400" cy="550" r="5" fill="#374151"/><g class="wire" data-category="ground"><polyline points="650,550 1400,550" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="650,550 1400,550" fill="none" stroke="#374151" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="650" cy="550" r="4" fill="#374151"/><circle cx="1400" cy="550" r="4" fill="#374151"/></g><g class="wire" data-category="ground"><polyline points="1050,550 1050,615" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1050,550 1050,615" fill="none" stroke="#374151" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1050" cy="550" r="4" fill="#374151"/><circle cx="1050" cy="615" r="4" fill="#374151"/></g><circle cx="1050" cy="550" r="5" fill="#374151"/><rect x="960" y="615" width="230" height="115" rx="8" fill="#f8fafb" stroke="#a7bac7" stroke-width="2"/><text x="975" y="645" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">Logic-level</text><text x="975" y="669" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#536778">N-channel MOSFET</text><text x="1050" y="610" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#374151">DRAIN</text><text x="1090" y="754" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#374151">SOURCE</text><text x="947" y="663" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="end" fill="#8541b0">GATE</text><g class="wire" data-category="digital"><polyline points="280,680 960,680" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="280,680 960,680" fill="none" stroke="#8541b0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="280" cy="680" r="4" fill="#8541b0"/><circle cx="960" cy="680" r="4" fill="#8541b0"/></g><text x="140" y="686" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#8541b0">Main D10</text><rect x="500" y="670" width="78" height="20" rx="1" fill="#fff7dd" stroke="#8541b0" stroke-width="2"/><text x="539" y="662" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8541b0">1k ohm</text><g class="wire" data-category="ground"><polyline points="1050,730 1050,825 290,825" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1050,730 1050,825 290,825" fill="none" stroke="#374151" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1050" cy="730" r="4" fill="#374151"/><circle cx="290" cy="825" r="4" fill="#374151"/></g><text x="140" y="831" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#374151">Main GND</text><g class="wire" data-category="digital"><polyline points="740,680 740,735" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="740,680 740,735" fill="none" stroke="#8541b0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="740" cy="680" r="4" fill="#8541b0"/><circle cx="740" cy="735" r="4" fill="#8541b0"/></g><circle cx="740" cy="680" r="5" fill="#8541b0"/><rect x="730" y="735" width="20" height="50" rx="1" fill="#fff7dd" stroke="#374151" stroke-width="2"/><text x="780" y="769" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#142c42">100k ohm pull-down</text><g class="wire" data-category="ground"><polyline points="740,785 740,825" fill="none" stroke="white" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline points="740,785 740,825" fill="none" stroke="#374151" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="740" cy="785" r="4" fill="#374151"/><circle cx="740" cy="825" r="4" fill="#374151"/></g><circle cx="740" cy="825" r="5" fill="#374151"/><text x="1310" y="670" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">Identify G/D/S from the exact</text><text x="1310" y="700" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">MOSFET datasheet. Package leg</text><text x="1310" y="730" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#142c42">order is not standardized.</text><text x="40" y="936" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#142c42">ASSEMBLY ORDER</text><rect x="40" y="958" width="415" height="209" rx="10" fill="white" stroke="#d8e2e9" stroke-width="1"/><circle cx="68" cy="988" r="16" fill="#142c42" stroke="none" stroke-width="2"/><text x="68" y="994" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">1</text><text x="95" y="995" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">Separate resistors</text><text x="60" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">Main 5V -&gt; one 330-ohm resistor -&gt;</text><text x="60" y="1055" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">each green LED anode. Repeat four</text><text x="60" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">times; do not share one resistor.</text><rect x="475" y="958" width="415" height="209" rx="10" fill="white" stroke="#d8e2e9" stroke-width="1"/><circle cx="503" cy="988" r="16" fill="#142c42" stroke="none" stroke-width="2"/><text x="503" y="994" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">2</text><text x="530" y="995" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">Join cathodes</text><text x="495" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">Join all four LED cathodes at the</text><text x="495" y="1055" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">MOSFET drain. MOSFET source -&gt; Main</text><text x="495" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">GND.</text><rect x="910" y="958" width="415" height="209" rx="10" fill="white" stroke="#d8e2e9" stroke-width="1"/><circle cx="938" cy="988" r="16" fill="#142c42" stroke="none" stroke-width="2"/><text x="938" y="994" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">3</text><text x="965" y="995" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">Control input</text><text x="930" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">D10 -&gt; 1k-ohm resistor -&gt; gate. Add</text><text x="930" y="1055" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">a 100k gate-to-GND resistor so the</text><text x="930" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">MOSFET defaults off.</text><rect x="1345" y="958" width="415" height="209" rx="10" fill="white" stroke="#d8e2e9" stroke-width="1"/><circle cx="1373" cy="988" r="16" fill="#142c42" stroke="none" stroke-width="2"/><text x="1373" y="994" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">4</text><text x="1400" y="995" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#142c42">Test fade</text><text x="1365" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">The current firmware fades D10. Use</text><text x="1365" y="1055" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">a MOSFET specified for operation at</text><text x="1365" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">a 5V gate. Keep the center RGB</text><text x="1365" y="1105" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#142c42">optical area separate if desired.</text><text x="40" y="1202" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#536778">Line colors identify signals; use pin labels even if your jumper colors differ. Dots mark electrical junctions.</text><text x="40" y="1230" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#536778">Board illustration is simplified; it is not a drill template or a breadboard-hole map. See Sources in the browser guide.</text><text x="1760" y="1230" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#536778">05 / Dual-Reality Maze</text></svg>