<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740"><rect width="1400" height="740" fill="#f3f6fa"/><style>text{font:17px sans-serif;fill:#152d44}.title{font:bold 26px sans-serif}</style><text x="30" y="40" class="title">Explorer — terminal connection chart</text><text x="30" y="75">Logical connections, not an exact breadboard footprint. Read the accompanying power and resistor notes.</text><rect x="25" y="100" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="130">5V</text><path d="M260 125H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="100" width="1040" height="50" rx="8" fill="white"/><text x="338" y="122">Joystick VCC; sensor supply</text><text x="338" y="143" style="font-size:14px">Own local + rail</text><rect x="25" y="170" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="200">GND</text><path d="M260 195H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="170" width="1040" height="50" rx="8" fill="white"/><text x="338" y="192">Joystick GND; local ground rail</text><text x="338" y="213" style="font-size:14px">Shared signal ground</text><rect x="25" y="240" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="270">A0</text><path d="M260 265H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="240" width="1040" height="50" rx="8" fill="white"/><text x="338" y="262">Joystick VRx</text><text x="338" y="283" style="font-size:14px">Raw horizontal input</text><rect x="25" y="310" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="340">A1</text><path d="M260 335H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="310" width="1040" height="50" rx="8" fill="white"/><text x="338" y="332">Joystick VRy</text><text x="338" y="353" style="font-size:14px">Raw vertical input</text><rect x="25" y="380" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="410">D2</text><path d="M260 405H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="380" width="1040" height="50" rx="8" fill="white"/><text x="338" y="402">Joystick SW</text><text x="338" y="423" style="font-size:14px">Switch to GND; INPUT_PULLUP</text><rect x="25" y="450" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="480">A2</text><path d="M260 475H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="450" width="1040" height="50" rx="8" fill="white"/><text x="338" y="472">Light-sensor node</text><text x="338" y="493" style="font-size:14px">Bare LDR: 5V → LDR → A2 → 10 kΩ → GND</text><rect x="25" y="520" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="550">A4 / SDA</text><path d="M260 545H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="520" width="1040" height="50" rx="8" fill="white"/><text x="338" y="542">Main A4 (SDA)</text><text x="338" y="563" style="font-size:14px">Same signal; do not connect twice</text><rect x="25" y="590" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="620">A5 / SCL</text><path d="M260 615H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="590" width="1040" height="50" rx="8" fill="white"/><text x="338" y="612">Main A5 (SCL)</text><text x="338" y="633" style="font-size:14px">Same signal; do not connect twice</text><rect x="25" y="660" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="690">GND</text><path d="M260 685H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="660" width="1040" height="50" rx="8" fill="white"/><text x="338" y="682">Main GND</text><text x="338" y="703" style="font-size:14px">Third conductor in the controller cable</text></svg>