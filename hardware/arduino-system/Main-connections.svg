<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"><rect width="1400" height="880" fill="#f3f6fa"/><style>text{font:17px sans-serif;fill:#152d44}.title{font:bold 26px sans-serif}</style><text x="30" y="40" class="title">Main — terminal connection chart</text><text x="30" y="75">Logical connections, not an exact breadboard footprint. Read the accompanying power and resistor notes.</text><rect x="25" y="100" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="130">USB-C</text><path d="M260 125H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="100" width="1040" height="50" rx="8" fill="white"/><text x="338" y="122">Laptop USB data port</text><text x="338" y="143" style="font-size:14px">115200 serial + power for initial test</text><rect x="25" y="170" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="200">Header SDA (A4 equivalent)</text><path d="M260 195H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="170" width="1040" height="50" rx="8" fill="white"/><text x="338" y="192">Explorer A4, Architect A4, LCD SDA</text><text x="338" y="213" style="font-size:14px">5V header bus; NOT Qwiic</text><rect x="25" y="240" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="270">Header SCL (A5 equivalent)</text><path d="M260 265H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="240" width="1040" height="50" rx="8" fill="white"/><text x="338" y="262">Explorer A5, Architect A5, LCD SCL</text><text x="338" y="283" style="font-size:14px">5V header bus; NOT Qwiic</text><rect x="25" y="310" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="340">GND</text><path d="M260 335H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="310" width="1040" height="50" rx="8" fill="white"/><text x="338" y="332">Both R3 grounds; LCD GND; buzzer −</text><text x="338" y="353" style="font-size:14px">All signal grounds common</text><rect x="25" y="380" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="410">5V</text><path d="M260 405H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="380" width="1040" height="50" rx="8" fill="white"/><text x="338" y="402">LCD VCC; Main local + rail</text><text x="338" y="423" style="font-size:14px">LCD backpack must be a 5V-compatible model</text><rect x="25" y="450" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="480">D3</text><path d="M260 475H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="450" width="1040" height="50" rx="8" fill="white"/><text x="338" y="472">330 Ω → RGB red</text><text x="338" y="493" style="font-size:14px">RGB common cathode to GND</text><rect x="25" y="520" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="550">D5</text><path d="M260 545H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="520" width="1040" height="50" rx="8" fill="white"/><text x="338" y="542">330 Ω → RGB green</text><text x="338" y="563" style="font-size:14px">Separate resistor</text><rect x="25" y="590" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="620">D9</text><path d="M260 615H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="590" width="1040" height="50" rx="8" fill="white"/><text x="338" y="612">330 Ω → RGB blue</text><text x="338" y="633" style="font-size:14px">Main RGB common lead goes to GND</text><rect x="25" y="660" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="690">D6</text><path d="M260 685H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="660" width="1040" height="50" rx="8" fill="white"/><text x="338" y="682">Small passive piezo +</text><text x="338" y="703" style="font-size:14px">Piezo −→GND; use a driver for high-current/active buzzers</text><rect x="25" y="730" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="760">D10</text><path d="M260 755H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="730" width="1040" height="50" rx="8" fill="white"/><text x="338" y="752">100 Ω → logic-level N-MOSFET gate</text><text x="338" y="773" style="font-size:14px">Four green LEDs, optional channel below</text><rect x="25" y="800" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="830">D2</text><path d="M260 825H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="800" width="1040" height="50" rx="8" fill="white"/><text x="338" y="822">Reserved, unconnected</text><text x="338" y="843" style="font-size:14px">No physical master-power switching implemented</text></svg>