<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670"><rect width="1400" height="670" fill="#f3f6fa"/><style>text{font:17px sans-serif;fill:#152d44}.title{font:bold 26px sans-serif}</style><text x="30" y="40" class="title">Architect — terminal connection chart</text><text x="30" y="75">Logical connections, not an exact breadboard footprint. Read the accompanying power and resistor notes.</text><rect x="25" y="100" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="130">5V</text><path d="M260 125H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="100" width="1040" height="50" rx="8" fill="white"/><text x="338" y="122">One outer potentiometer terminal</text><text x="338" y="143" style="font-size:14px">10 kΩ potentiometer</text><rect x="25" y="170" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="200">GND</text><path d="M260 195H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="170" width="1040" height="50" rx="8" fill="white"/><text x="338" y="192">Other outer potentiometer terminal</text><text x="338" y="213" style="font-size:14px">Swap outer leads if direction feels reversed</text><rect x="25" y="240" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="270">A0</text><path d="M260 265H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="240" width="1040" height="50" rx="8" fill="white"/><text x="338" y="262">Potentiometer centre/wiper</text><text x="338" y="283" style="font-size:14px">Not an outer terminal</text><rect x="25" y="310" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="340">D2</text><path d="M260 335H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="310" width="1040" height="50" rx="8" fill="white"/><text x="338" y="332">One electrical side of pushbutton</text><text x="338" y="353" style="font-size:14px">Other side goes to GND</text><rect x="25" y="380" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="410">D9</text><path d="M260 405H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="380" width="1040" height="50" rx="8" fill="white"/><text x="338" y="402">Servo signal</text><text x="338" y="423" style="font-size:14px">Usually orange/yellow; check servo labels</text><rect x="25" y="450" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="480">A4/A5/GND</text><path d="M260 475H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="450" width="1040" height="50" rx="8" fill="white"/><text x="338" y="472">Main SDA/SCL/GND</text><text x="338" y="493" style="font-size:14px">Three-wire controller cable</text><rect x="25" y="520" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="550">NO Arduino power pin</text><path d="M260 545H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="520" width="1040" height="50" rx="8" fill="white"/><text x="338" y="542">Servo positive</text><text x="338" y="563" style="font-size:14px">External regulated +5V only</text><rect x="25" y="590" width="235" height="50" rx="8" fill="#dce7f1"/><text x="35" y="620">Common GND</text><path d="M260 615H325" stroke="#278a82" stroke-width="3"/><rect x="325" y="590" width="1040" height="50" rx="8" fill="white"/><text x="338" y="612">Servo negative + external-supply negative</text><text x="338" y="633" style="font-size:14px">Signal reference must be shared</text></svg>